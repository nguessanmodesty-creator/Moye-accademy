<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#1C2370">
<meta name="description" content="Clearway English : programme d'anglais sur 90 jours, vocabulaire, reading, listening, speaking, writing, tests et vidéos.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Clearway">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Clearway English — Programme 90 Jours</title>
<style>
:root{
  --ultra:#1C2370; --ultra-2:#2A34A6; --ultra-tint:#E3E6F7;
  --ink:#161B33; --mut:#5B6384; --paper:#F5F7FC; --mist:#EEF1F8; --line:#D8DDEB;
  --amber:#F2B632; --amber-tint:#FDF1D3;
  --ok:#1F8A5B; --ok-bg:#E4F5EC; --bad:#BF3B3B; --bad-bg:#FBE9E9;
  --wave:#1DC4FF; --om:#FF7900;
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
  --sans:"Inter","Segoe UI",system-ui,-apple-system,Roboto,sans-serif;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;font:16px/1.55 var(--sans);color:var(--ink);background:var(--paper);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}
input,textarea,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--amber);outline-offset:2px}
h1,h2,h3{font-family:var(--serif);font-weight:600;line-height:1.2;margin:0}
h1{font-size:clamp(26px,4vw,34px)}
h2{font-size:22px;margin-bottom:10px}
h3{font-size:18px}
p{margin:0 0 10px}
.mut{color:var(--mut)}
.small{font-size:14px}

/* layout */
.app{display:grid;grid-template-columns:255px 1fr;min-height:100vh}
.side{background:var(--ultra);color:#fff;padding:22px 14px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:4px;overflow:auto}
.brand{display:flex;gap:11px;align-items:center;padding:2px 10px 18px;font-family:var(--serif);font-size:22px;font-weight:600}
.brand svg{width:30px;height:30px;flex:none}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{display:flex;align-items:center;gap:12px;background:none;border:0;border-left:3px solid transparent;color:#C9CEF2;padding:9px 12px;border-radius:0 10px 10px 0;text-align:left;font-size:15px}
.nav button svg{width:19px;height:19px;flex:none}
.nav button:hover{background:rgba(255,255,255,.07);color:#fff}
.nav button.on{background:rgba(255,255,255,.13);color:#fff;border-left-color:var(--amber);font-weight:600}
.xpbox{margin-top:auto;padding:12px 14px;border:1px solid rgba(255,255,255,.18);border-radius:12px;font-size:13px;color:#D5D9F5}
.xpbox b{color:#fff;font-size:19px;font-family:var(--serif)}
.xpbar{height:6px;border-radius:9px;background:rgba(255,255,255,.18);margin-top:6px;overflow:hidden}
.xpbar i{display:block;height:100%;background:var(--amber);width:0;transition:width .4s}
main{padding:32px clamp(18px,4vw,48px) 80px;max-width:1140px;width:100%}
.tabbar{display:none}
.pagehead{margin-bottom:24px}
.pagehead p{color:var(--mut);max-width:65ch;margin-top:6px}

/* components */
.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:20px}
.grid{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(250px,1fr))}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.btn{background:var(--ultra);color:#fff;border:0;border-radius:10px;padding:10px 18px;font-weight:600;display:inline-flex;gap:8px;align-items:center;justify-content:center;transition:background .15s,transform .1s}
.btn:hover{background:var(--ultra-2)}
.btn:active{transform:scale(.98)}
.btn.ghost{background:#fff;color:var(--ultra);border:1.5px solid var(--ultra)}
.btn.ghost:hover{background:var(--ultra-tint)}
.btn.amber{background:var(--amber);color:var(--ink)}
.btn.amber:hover{background:#E6A91F}
.btn.ok{background:var(--ok);color:#fff}
.btn.ok:hover{background:#187049}
.btn.sm{padding:6px 12px;font-size:14px;border-radius:8px}
.btn svg{width:18px;height:18px}
.iconbtn{width:42px;height:42px;border-radius:50%;border:0;background:var(--amber);color:var(--ink);display:inline-grid;place-items:center;flex:none}
.iconbtn:hover{background:#E6A91F}
.iconbtn svg{width:20px;height:20px}
.chip{border:1.5px solid var(--line);background:#fff;border-radius:99px;padding:6px 14px;font-size:14px}
.chip:hover{border-color:var(--ultra)}
.chip.on{background:var(--ultra);border-color:var(--ultra);color:#fff}
.lv{display:inline-block;font-size:12px;font-weight:700;border-radius:6px;padding:2px 8px;letter-spacing:.2px}
.lv-A{background:var(--ok-bg);color:var(--ok)}
.lv-B{background:var(--ultra-tint);color:var(--ultra)}
.lv-C{background:var(--amber-tint);color:#8A5A00}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:18px;border-bottom:1px solid var(--line);padding-bottom:12px}
.bar{height:8px;background:var(--mist);border-radius:9px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--ultra);border-radius:9px;transition:width .3s}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:10px;font-size:14px;z-index:150;box-shadow:0 8px 20px rgba(0,0,0,.2)}
.tile{display:flex;flex-direction:column;gap:8px;text-align:left;cursor:pointer;transition:border-color .15s,transform .15s}
.tile:hover{border-color:var(--ultra);transform:translateY(-2px)}
.tile .ic{width:40px;height:40px;border-radius:10px;background:var(--ultra-tint);color:var(--ultra);display:grid;place-items:center}
.tile .ic svg{width:22px;height:22px}

/* home */
.hero{display:grid;grid-template-columns:1.6fr 1fr;gap:16px;margin-bottom:22px}
.wod{background:var(--ultra);color:#fff;border-radius:18px;padding:28px 30px;position:relative;overflow:hidden}
.wod .w{font-family:var(--serif);font-size:clamp(38px,6vw,58px);line-height:1;margin:6px 0 8px}
.wod .ipa{color:#B9BFEF}
.wod .fr{font-size:20px;margin:12px 0 4px}
.wod .ex{color:#D5D9F5;font-style:italic;max-width:46ch}
.wod .iconbtn{position:absolute;right:24px;top:24px;width:48px;height:48px}
.goal{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;text-align:center}
.ring{position:relative;width:116px;height:116px}
.ring svg{width:116px;height:116px;transform:rotate(-90deg)}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--serif);font-size:26px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;width:100%;margin-top:6px}
.stats div{background:var(--mist);border-radius:10px;padding:8px 4px}
.stats b{display:block;font-family:var(--serif);font-size:19px}
.stats span{font-size:11px;color:var(--mut)}

/* 90-day roadmap */
.road-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(135px,1fr));gap:10px;margin-top:14px}
.day-card{background:#fff;border:1.5px solid var(--line);border-radius:12px;padding:12px;text-align:left;display:flex;flex-direction:column;gap:4px;position:relative;transition:all .15s}
.day-card:hover{border-color:var(--ultra)}
.day-card.done{background:var(--ok-bg);border-color:#9AD7BC}
.day-card.curr{border-color:var(--amber);box-shadow:0 0 0 2px var(--amber-tint)}
.day-card.locked{background:var(--mist);opacity:.85}
.day-num{font-family:var(--serif);font-weight:700;font-size:17px;display:flex;justify-content:space-between;align-items:center}
.day-topic{font-size:12px;color:var(--mut);line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.seq-step{border-left:3px solid var(--ultra);padding:12px 16px;background:var(--mist);border-radius:0 12px 12px 0;margin-bottom:14px}
.seq-step h4{margin:0 0 6px;font-size:16px;color:var(--ultra)}

/* flashcards & speaking */
.fc{min-height:250px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:10px;padding:32px 24px;cursor:pointer;user-select:none}
.fc .big{font-family:var(--serif);font-size:clamp(32px,5vw,48px)}
.fc.back{background:var(--ultra-tint);border-color:#C5CBF0}
.fc .ex{font-style:italic;color:var(--mut);max-width:44ch}
.mic-btn{width:68px;height:68px;border-radius:50%;border:0;background:var(--ultra);color:#fff;display:grid;place-items:center;margin:10px auto;transition:all .2s}
.mic-btn.rec{background:var(--bad);animation:pulse 1.2s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(191,59,59,.5)}70%{box-shadow:0 0 0 16px rgba(191,59,59,0)}100%{box-shadow:0 0 0 0 rgba(191,59,59,0)}}

/* quiz */
.qhead{display:flex;align-items:center;gap:14px;margin-bottom:18px;font-size:14px;color:var(--mut)}
.qhead .bar{flex:1}
.qtext{font-size:21px;margin-bottom:18px}
.opts{display:grid;gap:10px;max-width:640px}
.opt{text-align:left;background:#fff;border:1.5px solid var(--line);border-radius:10px;padding:12px 16px;transition:border-color .12s,background .12s}
.opt:hover:not(:disabled){border-color:var(--ultra);background:var(--ultra-tint)}
.opt.ok{border-color:var(--ok);background:var(--ok-bg);font-weight:600}
.opt.no{border-color:var(--bad);background:var(--bad-bg)}
.opt:disabled{cursor:default}
.fb{margin-top:16px;padding:14px 16px;border-radius:10px;max-width:640px}
.fb.ok{background:var(--ok-bg)}
.fb.no{background:var(--bad-bg)}
.score{font-family:var(--serif);font-size:50px;line-height:1}
.review{display:grid;gap:10px;margin-top:16px}
.review div{border-left:4px solid var(--bad);background:var(--bad-bg);padding:10px 14px;border-radius:0 10px 10px 0;font-size:15px}

/* reading & writing */
.text{font-family:var(--serif);font-size:19px;line-height:1.75;max-width:68ch}
.gl{border-bottom:2px dotted var(--ultra);cursor:pointer;color:var(--ultra)}
.gloss{background:var(--amber-tint);border-radius:10px;padding:10px 14px;margin:14px 0;font-size:15px;min-height:44px}
.split{display:grid;grid-template-columns:1.15fr 1fr;gap:26px;align-items:start}
textarea{width:100%;min-height:200px;border:1.5px solid var(--line);border-radius:12px;padding:14px;resize:vertical;line-height:1.6;background:#fff}
textarea:focus{border-color:var(--ultra);outline:none}
input[type=text],select{border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;background:#fff;width:100%}
select{width:auto}
.check{display:flex;gap:10px;align-items:flex-start;padding:6px 0}
.check i{flex:none;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-style:normal;font-size:13px;font-weight:700}
.check i.y{background:var(--ok);color:#fff}
.check i.n{background:var(--mist);color:var(--mut);border:1.5px solid var(--line)}
.model{background:var(--mist);border-radius:12px;padding:16px 18px;font-family:var(--serif);font-size:17px;line-height:1.7;white-space:pre-wrap}

/* tables & visual */
.tbl{width:100%;border-collapse:collapse;font-size:15px;background:#fff;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.tbl th{background:var(--mist);text-align:left;padding:10px 14px;font-weight:600}
.tbl td{padding:9px 14px;border-top:1px solid var(--line);vertical-align:top}
.tblwrap{overflow-x:auto}
.vd{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:12px}
.vd button{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px 8px 12px;display:flex;flex-direction:column;align-items:center;gap:2px}
.vd button:hover{border-color:var(--ultra);background:var(--ultra-tint)}
.vd .em{font-size:44px;line-height:1.1}
.vd b{font-family:var(--serif);font-size:17px}
.vd span{font-size:13px;color:var(--mut)}
.tl{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.tl .col{border-top:5px solid var(--ultra);background:#fff;border-radius:0 0 14px 14px;border:1px solid var(--line);border-top-width:5px;padding:16px}
.tl .col.past{border-top-color:#7C84C9}
.tl .col.now{border-top-color:var(--amber)}
.tl .col.fut{border-top-color:var(--ok)}
.tense{padding:10px 0;border-top:1px solid var(--mist)}
.tense b{display:block}
.tense .ex{font-family:var(--serif);font-style:italic;font-size:16px}
.funnel{display:grid;gap:10px;max-width:640px}
.funnel div{border-radius:12px;padding:14px 18px;color:#fff}
.funnel .f1{background:var(--ultra);width:100%}
.funnel .f2{background:var(--ultra-2);width:82%}
.funnel .f3{background:#4C58C7;width:64%}
.funnel b{font-family:var(--serif);font-size:24px;margin-right:10px}
.player{aspect-ratio:16/9;width:100%;border:0;border-radius:14px;background:var(--ink)}
.vph{aspect-ratio:16/9;border-radius:14px;background:var(--ink);color:#C9CEF2;display:grid;place-items:center;text-align:center;padding:20px}

/* Premium & Mobile Money Paywall */
.lk{display:inline-grid;vertical-align:-2px;margin-left:6px;opacity:.8}
.lk svg{width:14px;height:14px}
.prem{display:inline-block;font-size:12px;font-weight:700;border-radius:6px;padding:2px 8px;margin-left:6px;background:var(--amber-tint);color:#8A5A00}
.banner{display:flex;gap:16px;align-items:center;justify-content:space-between;flex-wrap:wrap;background:linear-gradient(135deg,#FDF1D3 0%,#FBE4A8 100%);border:1px solid #EBCB84;border-radius:14px;padding:18px 22px;margin-bottom:24px}
.modal{position:fixed;inset:0;background:rgba(22,27,51,.65);backdrop-filter:blur(3px);display:grid;place-items:center;padding:16px;z-index:100}
.sheet{background:#fff;border-radius:18px;max-width:480px;width:100%;max-height:92vh;overflow:auto;padding:26px 24px;position:relative;box-shadow:0 20px 40px rgba(0,0,0,.25)}
.sheet .x{position:absolute;right:12px;top:10px;border:0;background:none;font-size:28px;line-height:1;color:var(--mut);width:38px;height:38px}
.benefits{padding-left:20px;margin:12px 0;font-size:14.5px}
.benefits li{margin-bottom:4px}
.price-tag{background:var(--ultra-tint);color:var(--ultra);padding:12px 16px;border-radius:12px;margin:12px 0;display:flex;justify-content:space-between;align-items:center}
.price-tag b{font-family:var(--serif);font-size:24px}
.momo-box{border:1.5px solid var(--line);border-radius:12px;padding:14px;background:var(--paper);margin-bottom:14px}
.momo-badges{display:flex;gap:8px;margin-bottom:10px}
.badge-wave{background:#E0F7FF;color:#0077A3;border:1px solid #99E3FF;font-weight:700;font-size:13px;padding:4px 10px;border-radius:8px;display:inline-flex;align-items:center;gap:6px}
.badge-om{background:#FFF0E0;color:#B85600;border:1px solid #FFCCA3;font-weight:700;font-size:13px;padding:4px 10px;border-radius:8px;display:inline-flex;align-items:center;gap:6px}
.num-box{display:flex;justify-content:space-between;align-items:center;background:#fff;border:1px solid var(--line);padding:8px 12px;border-radius:8px;font-family:monospace;font-size:16px;font-weight:700;margin:8px 0}
.prembox{margin-top:8px;padding:12px 14px;border:1px solid rgba(255,255,255,.18);border-radius:12px;font-size:13px;color:#D5D9F5;display:flex;flex-direction:column;gap:8px;align-items:flex-start}
.prembox b{color:#fff;font-size:14px}
.lnk{background:none;border:0;color:#B9BFEF;text-decoration:underline;padding:0;font-size:12px}

@media (max-width:860px){
  .app{grid-template-columns:1fr}
  .side{display:none}
  main{padding-bottom:96px}
  .hero,.split,.tl{grid-template-columns:1fr}
  .tabbar{display:flex;position:fixed;left:0;right:0;bottom:0;background:var(--ultra);z-index:20;overflow-x:auto;padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
  .tabbar button{flex:1 0 auto;min-width:64px;background:none;border:0;color:#B9BFEF;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 4px;font-size:11px;border-radius:10px}
  .tabbar button svg{width:20px;height:20px}
  .tabbar button.on{color:#fff;background:rgba(255,255,255,.14)}
  .wod{padding:22px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="brand">
      <svg viewBox="0 0 32 32" fill="none"><rect width="32" height="32" rx="9" fill="#F2B632"/><path d="M7 22c4-1 6-4 9-12 3 8 5 11 9 12" stroke="#1C2370" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
      Clearway
    </div>
    <nav class="nav" id="nav" aria-label="Navigation principale"></nav>
    <div class="xpbox">
      <div style="display:flex;justify-content:space-between"><span>Points du jour</span><span>🔥 <b style="font-size:14px" id="streak">1</b>j</span></div>
      <b id="xp">0</b> <span>/ 50 XP</span>
      <div class="xpbar"><i id="xpbar"></i></div>
    </div>
    <div class="prembox" id="prembox"></div>
  </aside>
  <main id="view" tabindex="-1"></main>
</div>
<nav class="tabbar" id="tabbar" aria-label="Navigation mobile"></nav>

<script>
/* ============ CONFIGURATION PREMIUM & MOBILE MONEY (CÔTE D'IVOIRE) ============ */
const CONFIG={
  priceLabel:"10 000 FCFA / mois",
  momoNumber:"+225 07 57 33 37 36",
  momoRaw:"2250757333736",
  /* Codes valides générés :
     - CLW-2026-VIP1
     - CLW-WAVE-10000
     - CLW-OMCI-2026
     - CLW-GOLD-9001
     - CLW-PRO1-2026
     - CLW-FAST-3373
     - CLW-ABID-2026
     - CLW-90JS-VIP8
  */
  codeHashes:[
    "4647857955071901","2849165932243017","5831609964143850","3592680832948715",
    "5610020132596924","6288583205126055","1421744294304284","5334793579297343",
    "6193261337082725","4813537626374129","7809158927514286","3737121614483031",
    "2562670709487639","5102975672716091","6489962364024002","8053960695412945"
  ],
  free:{
    daysMax:5, // Les 5 premiers jours du parcours 90 jours sont gratuits
    vocab:['travel','daily'],
    reading:['r1'],
    listen:['l1'],
    write:['w1'],
    test:['placement','preps'],
    vis:['dict','tenses'],
    visCat:['animals','food'],
    videos:3,
    dictN:2,
    speakN:2
  }
};

/* ============ Stockage & Sécurité ============ */
const STORE_PREM='clw_premium_v2';
const STORE_DATA='clw_progress_v2';
const store={
  get(k){try{return localStorage.getItem(k);}catch(e){return null;}},
  set(k,v){try{localStorage.setItem(k,v);}catch(e){}}
};
const cyrb53=(str,seed=0)=>{let h1=0xdeadbeef^seed,h2=0x41c6ce57^seed;for(let i=0,ch;i<str.length;i++){ch=str.charCodeAt(i);h1=Math.imul(h1^ch,2654435761);h2=Math.imul(h2^ch,1597334677);}h1=Math.imul(h1^(h1>>>16),2246822507)^Math.imul(h2^(h2>>>13),3266489909);h2=Math.imul(h2^(h2>>>16),2246822507)^Math.imul(h1^(h1>>>13),3266489909);return 4294967296*(2097151&h2)+(h1>>>0);};
const normCode=s=>String(s||'').toUpperCase().replace(/[^A-Z0-9]/g,'');
const isLocked=(kind,id)=>!S.premium&&!CONFIG.free[kind].includes(id);
const lockIco=()=>`<span class="lk" title="Contenu Premium">${ico('lock')}</span>`;
const lk=(k,i)=>isLocked(k,i)?lockIco():'';
const prem=(k,i)=>isLocked(k,i)?'<span class="prem">Premium</span>':'';

let lastFocus=null;
function closePaywall(){const m=document.getElementById('paywall');if(m){m.remove();if(lastFocus&&lastFocus.focus)lastFocus.focus();}}
function paywall(feature){
  closePaywall();lastFocus=document.activeElement;
  const waMsg=encodeURIComponent(`Bonjour Clearway English ! Je viens d'effectuer le paiement de 10 000 FCFA pour mon abonnement Premium (1 mois). Merci de m'envoyer mon code d'activation.`);
  const m=document.createElement('div');m.id='paywall';m.className='modal';
  m.innerHTML=`<div class="sheet" role="dialog" aria-modal="true" aria-labelledby="pwt">
    <button class="x" data-act="pwclose" aria-label="Fermer">×</button>
    <h2 id="pwt">Passer à Clearway Premium</h2>
    <p class="mut small" style="margin:4px 0 0">${feature?'Débloquez : <b>'+esc(feature)+'</b> et tout le programme complet.':'Accédez à l'intégralité du programme sur 3 mois sans restriction.'}</p>
    
    <div class="price-tag">
      <div><span class="small">Abonnement tout inclus</span><br><b>${esc(CONFIG.priceLabel)}</b></div>
      <span class="lv lv-C">Sans engagement</span>

/* ============ Synthèse vocale ============ */
let voices=[],playTok=0;
function loadVoices(){if('speechSynthesis' in window)voices=speechSynthesis.getVoices().filter(v=>/^en/i.test(v.lang));}
if('speechSynthesis' in window){loadVoices();speechSynthesis.onvoiceschanged=loadVoices;}
function stopSpeak(){playTok++;if('speechSynthesis' in window)speechSynthesis.cancel();const p=$('#playbtn');if(p)p.classList.remove('busy');}
function speak(text,rate=1){
  if(!('speechSynthesis' in window)){toast("Audio indisponible sur ce navigateur.");return;}
  speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(text);u.lang='en-GB';u.rate=rate;
  if(voices.length)u.voice=voices.find(v=>/GB/i.test(v.lang))||voices[0];
  speechSynthesis.speak(u);
}
function playLines(lines,rate,done){
  if(!('speechSynthesis' in window)){toast("Audio indisponible : lisez la transcription.");return;}
  speechSynthesis.cancel();const tok=++playTok;
  const run=i=>{
    if(tok!==playTok)return;
    if(i>=lines.length){done&&done();return;}
    const u=new SpeechSynthesisUtterance(lines[i].t);u.lang='en-GB';u.rate=rate;
    if(voices.length){u.voice=voices[(lines[i].v||0)%voices.length];}
    u.pitch=lines[i].v?1.25:0.95;
    u.onend=()=>run(i+1);u.onerror=()=>run(i+1);
    speechSynthesis.speak(u);
  };
  run(0);
}

/* ============ Moteur de quiz ============ */
const Q=(q,a,w,e,l)=>({q,a,w,e,l});
function runQuiz(el,qs,opts={}){
  const items=qs.map(x=>({...x,opts:shuffle([x.a,...x.w])}));
  let i=0,score=0,log=[];
  function show(){
    if(i>=items.length)return done();
    const it=items[i];
    el.innerHTML=`<div class="qhead"><span>Question ${i+1} sur ${items.length}</span><div class="bar"><i style="width:${i/items.length*100}%"></i></div></div>
    <h3 class="qtext">${esc(it.q)}</h3>
    <div class="opts">${it.opts.map((o,k)=>`<button class="opt" data-k="${k}">${esc(o)}</button>`).join('')}</div><div id="fb"></div>`;
    el.querySelectorAll('.opt').forEach(b=>b.onclick=()=>answer(b,it));
  }
  function answer(b,it){
    const chosen=it.opts[+b.dataset.k],ok=chosen===it.a;
    el.querySelectorAll('.opt').forEach(x=>{x.disabled=true;if(it.opts[+x.dataset.k]===it.a)x.classList.add('ok');});
    if(!ok)b.classList.add('no');
    if(ok){score++;addXP(5);}
    log.push({it,chosen,ok});
    const last=i===items.length-1;
    $('#fb',el).innerHTML=`<div class="fb ${ok?'ok':'no'}"><b>${ok?'Bonne réponse !':'Pas tout à fait.'}</b> ${it.e?esc(it.e):''}
      <div style="margin-top:12px"><button class="btn" id="nextq">${last?'Voir mon résultat':'Question suivante'}</button></div></div>`;
    $('#nextq',el).focus();
    $('#nextq',el).onclick=()=>{i++;show();};
  }
  function done(){
    const pct=Math.round(score/items.length*100);
    const msg=pct>=85?"Excellent travail.":pct>=60?"Bon résultat, continuez comme ça.":"Revoyez les points ci-dessous puis réessayez.";
    const wrong=log.filter(l=>!l.ok);
    el.innerHTML=`<div class="qhead"><span>Terminé</span><div class="bar"><i style="width:100%"></i></div></div>
      <div class="row" style="gap:22px;align-items:flex-end"><div class="score">${score}<span class="mut" style="font-size:28px"> / ${items.length}</span></div><div><b>${pct} %</b><br>${msg}</div></div>
      <div id="extra"></div>
      ${wrong.length?`<h3 style="margin-top:22px">À revoir</h3><div class="review">${wrong.map(l=>`<div><b>${esc(l.it.q)}</b><br>Votre réponse : ${esc(l.chosen)} — Réponse correcte : <b>${esc(l.it.a)}</b>${l.it.e?'<br><span class="mut">'+esc(l.it.e)+'</span>':''}</div>`).join('')}</div>`:''}
      <div class="row" style="margin-top:22px"><button class="btn" id="again">Recommencer</button>${opts.backLabel?`<button class="btn ghost" id="backq">${opts.backLabel}</button>`:''}</div>`;
    $('#again',el).onclick=()=>runQuiz(el,qs,opts);
    if(opts.onBack&&$('#backq',el))$('#backq',el).onclick=opts.onBack;
    if(opts.onFinish)opts.onFinish({score,total:items.length,pct,log},$('#extra',el));
  }
  show();
}

/* ============ Parcours 90 Jours ============ */
V.plan=()=>{
  const m=S.plan.month;
  const openD=S.plan.openDay;
  if(openD){
    const idx=openD-1;
    const topic=CURRICULUM_TOPICS[idx];
    const allWords=Object.values(VOCAB).flatMap(t=>t.words);
    const dayWords=[allWords[(idx*3)%allWords.length], allWords[(idx*3+1)%allWords.length], allWords[(idx*3+2)%allWords.length]];
    const isDone=S.daysDone.has(openD);
    const lv=openD<=30?'A1–A2':openD<=60?'B1':'B2–C1';

    $('#view').innerHTML=`<button class="btn ghost sm" data-act="dayback">← Retour au calendrier 90 jours</button>
    <div class="pagehead" style="margin-top:16px">
      <div class="row"><span class="lv lv-${lv[0]}">Mois ${Math.ceil(openD/30)} · ${lv}</span>${isDone?'<span class="lv lv-A">✓ Séquence validée</span>':''}</div>
      <h1 style="margin-top:8px">Jour ${openD} : ${esc(topic[0])}</h1>
      <p>Temps estimé : 15 à 20 minutes. Complétez les 3 étapes ci-dessous pour valider votre journée.</p>
    </div>

    <div class="card" style="max-width:780px">
      <div class="seq-step">
        <h4>Étape 1 : Vocabulaire clé du jour (5 min)</h4>
        <p class="small mut">Écoutez et répétez ces 3 mots essentiels :</p>
        <div style="display:grid;gap:8px;margin-top:10px">
          ${dayWords.map(w=>`<div class="row" style="justify-content:space-between;background:#fff;padding:10px 14px;border-radius:10px;border:1px solid var(--line)">
            <div><b>${esc(w[0])}</b> <span class="mut small">${esc(w[1])}</span> — ${esc(w[2])}<div class="small mut" style="font-style:italic">« ${esc(w[3])} »</div></div>
            ${spk(w[0]+'. '+w[3])}

        </div>
      </div>

      <div class="seq-step" style="border-left-color:var(--amber)">
        <h4>Étape 2 : Point de Grammaire & Structure (5 min)</h4>
        <p><b>Focus : ${esc(topic[1])}</b></p>
        <p class="small mut">Consultez les règles correspondantes dans la rubrique <b>Visual aids</b> ou entraînez-vous avec les quiz thématiques pour ancrer cette structure.</p>
        <div class="row" style="margin-top:8px">
          <button class="btn sm ghost" data-act="nav" data-v="visual">Ouvrir Visual Aids</button>
          <button class="btn sm ghost" data-act="nav" data-v="tests">Faire un quiz</button>
        </div>
      </div>

      <div class="seq-step" style="border-left-color:var(--ok)">
        <h4>Étape 3 : Défi Pratique Actif (5 min)</h4>
        <p><b>Mission :</b> ${esc(topic[2])}</p>
        <p class="small mut">Utilisez l'atelier <b>Speaking</b> pour le dire à voix haute ou la rubrique <b>Writing</b> pour l'écrire.</p>
        <div class="row" style="margin-top:8px">
          <button class="btn sm ghost" data-act="nav" data-v="speaking">Pratiquer à l'oral</button>
          <button class="btn sm ghost" data-act="nav" data-v="writing">Écrire mon texte</button>
        </div>
      </div>

      <div class="row" style="justify-content:space-between;margin-top:20px;padding-top:16px;border-top:1px solid var(--line)">
        <button class="btn ${isDone?'ghost':'ok'}" data-act="toggleday" data-d="${openD}">
          ${isDone?'✓ Journée terminée (+20 XP gagnés)':'Valider le Jour '+openD+' (+20 XP)'}
        </button>
        ${openD<90?`<button class="btn" data-act="openday" data-d="${openD+1}">Jour suivant (${openD+1}) →</button>`:''}
      </div>
    </div>`;
    return;
  }

  const start=(m-1)*30+1, end=m*30;
  const pct=Math.round(S.daysDone.size/90*100);
  const monthDesc={
    1:"Mois 1 (Jours 1–30) : Bases solides, survie au quotidien, présent, passé simple et vocabulaire essentiel (Niveau A1–A2).",
    2:"Mois 2 (Jours 31–60) : Fluidité, present perfect, conditionnels, phrasal verbs et anglais professionnel (Niveau B1).",
    3:"Mois 3 (Jours 61–90) : Maîtrise avancée, argumentation, négociation, préparation IELTS/TOEFL et nuances (Niveau B2–C1)."
  }[m];

  let cards='';
  for(let d=start;d<=end;d++){
    const locked=!S.premium && d>CONFIG.free.daysMax;
    const done=S.daysDone.has(d);

    cards+=`<button class="day-card ${done?'done':''} ${curr?'curr':''} ${locked?'locked':''}" data-act="openday" data-d="${d}">

      <div class="day-topic">${esc(CURRICULUM_TOPICS[d-1][0])}</div>
    </button>`;
  }

  $('#view').innerHTML=head("Parcours Intensif 3 Mois (90 Jours)","Un programme étape par étape : 15 à 20 minutes par jour pour passer de débutant à un anglais fluide et professionnel.")+
  `<div class="card" style="margin-bottom:20px">
    <div class="row" style="justify-content:space-between;margin-bottom:8px"><b>Progression globale : ${S.daysDone.size} / 90 jours complétés</b><b>${pct} %</b></div>
    <div class="bar"><i style="width:${pct}%"></i></div>
  </div>
  <div class="tabs">
    <button class="chip ${m===1?'on':''}" data-act="pmonth" data-m="1">Mois 1 : Fondations (A1–A2)</button>
    <button class="chip ${m===2?'on':''}" data-act="pmonth" data-m="2">Mois 2 : Fluidité (B1)${!S.premium?lockIco():''}</button>
    <button class="chip ${m===3?'on':''}" data-act="pmonth" data-m="3">Mois 3 : Maîtrise (B2–C1)${!S.premium?lockIco():''}</button>
  </div>
  <p class="mut small" style="margin-bottom:14px">${monthDesc} ${!S.premium?'(Les 5 premiers jours sont gratuits pour tester la méthode.)':''}</p>
  <div class="road-grid">${cards}</div>`;
};

  </div>
  <div class="card" id="wreport">${W.reports[t.id]||'<h2>Analyse</h2><p class="mut">Rédigez votre texte puis touchez « Analyser mon texte ». Vous verrez ici le nombre de mots, les éléments attendus et les connecteurs utilisés.</p>'}</div></div>`;

function analyzeWriting(t,txt){
  const words=txt.trim().match(/[\w'’-]+/g)||[];
  const n=words.length;
  const sents=(txt.match(/[^.!?]+[.!?]+/g)||[txt]).filter(s=>s.trim()).length;
  const low=txt.toLowerCase();
  const used=CONNECTORS.filter(c=>new RegExp('\b'+c+'\b').test(low));
  const freq={};words.forEach(w=>{w=w.toLowerCase();if(w.length>3&&!STOP.has(w))freq[w]=(freq[w]||0)+1;});
  const rep=Object.entries(freq).filter(e=>e[1]>=4).sort((a,b)=>b[1]-a[1]).slice(0,4);
  const checks=t.checks.map(c=>[c[0],c[1].test(txt)]);
  const score=Math.round(40*Math.min(1,n/t.min)+40*checks.filter(c=>c[1]).length/checks.length+20*Math.min(1,used.length/3));
  const avg=sents?Math.round(n/sents):0;
  const tips=[];
  if(n<t.min)tips.push(`Ajoutez environ ${t.min-n} mots pour atteindre la longueur demandée.`);
  if(used.length<3)tips.push("Utilisez davantage de connecteurs pour relier vos idées (however, for example, because…).");
  if(avg&&avg<8)tips.push("Vos phrases sont courtes : essayez d'en combiner certaines avec « and », « because » ou « which ».");
  if(avg>28)tips.push("Certaines phrases sont très longues : scindez-les pour plus de clarté.");
  if(rep.length)tips.push(`Mots répétés : ${rep.map(r=>r[0]+' ('+r[1]+'×)').join(', ')}. Cherchez des synonymes.`);
  if(!tips.length)tips.push("Belle structure. Comparez maintenant avec le modèle pour enrichir votre vocabulaire.");
  return `<h2>Analyse</h2>
   <div class="row" style="gap:18px;margin-bottom:12px"><div class="score">${score}<span class="mut" style="font-size:24px"> / 100</span></div><div class="small mut">Score indicatif,<br>calculé automatiquement</div></div>
   <div class="bar" style="margin-bottom:14px"><i style="width:${score}%"></i></div>
   <p><b>${n}</b> mots · <b>${sents}</b> phrases · <b>${avg}</b> mots par phrase</p>
   <h3 style="margin:14px 0 4px">Éléments attendus</h3>
   ${checks.map(c=>`<div class="check"><i class="${c[1]?'y':'n'}">${c[1]?'✓':'–'}</i><span>${c[0]}</span></div>`).join('')}
   <h3 style="margin:14px 0 4px">Connecteurs trouvés</h3>
   <p>${used.length?used.map(u=>`<span class="lv lv-B" style="margin:0 4px 4px 0">${u}</span>`).join(''):'<span class="mut">Aucun pour l'instant.</span>'}</p>
   <h3 style="margin:14px 0 4px">Conseils</h3>${tips.map(x=>`<p>• ${esc(x)}</p>`).join('')}`;
}

    `<div class="grid">${TESTS.map(t=>`<button class="card tile" data-act="starttest" data-id="${t.id}">${lvBadge(t.lv)}${prem('test',t.id)}<h3>${t.title}</h3><span class="mut small">${t.desc}</span><span class="small">${t.qs.length} questions · ${t.time}</span></button>`).join('')}</div>

    return;
  }

   <div class="pagehead" style="margin-top:16px"><h1>${t.title}</h1><p>${t.desc}</p></div><div class="card" style="max-width:760px" id="quiz"></div>`;

    onFinish:(res,box)=>{
      let note=res.pct+' %';
      if(t.placement){
        const s=res.score,lvl=s<=5?'A1':s<=9?'A2':s<=13?'B1':s<=17?'B2':'C1';
        S.best=lvl;note='Niveau estimé '+lvl;
        const by={};res.log.forEach(l=>{const k=l.it.l;by[k]=by[k]||[0,0];by[k][1]++;if(l.ok)by[k][0]++;});
        const next={A1:"Commencez au Jour 1 du parcours 90 jours.",A2:"Travaillez les temps du passé et passez aux textes B1.",B1:"Enrichissez votre vocabulaire et démarrez le Mois 2.",B2:"Entraînez-vous à l'essai argumenté et démarrez le Mois 3.",C1:"Visez la perfection : phrasal verbs, idiomes et essais complexes."}[lvl];
        box.innerHTML=`<div class="card" style="background:var(--ultra-tint);border-color:#C5CBF0;margin-top:18px"><h3>Niveau estimé : ${lvl}</h3><p style="margin:6px 0 12px">${next}</p>
          ${['A1','A2','B1','B2','C1'].map(k=>`<div class="row" style="margin-bottom:6px"><span style="width:30px"><b>${k}</b></span><div class="bar" style="flex:1"><i style="width:${(by[k]?by[k][0]/by[k][1]:0)*100}%"></i></div><span class="small mut">${by[k]?by[k][0]:0}/${by[k]?by[k][1]:0}</span></div>`).join('')}</div>`;
      }
      S.tests.push({title:t.title,score:res.score,total:res.total,note});
      saveProgress();
    }});
};

    <p class="small" style="color:var(--bad);margin:6px 0 0">${v.msg}</p>
    <p class="small mut" style="margin-top:8px">Astuce : activez les sous-titres anglais, puis ralentissez la vitesse de lecture si besoin.</p>
  </div>
  <div><h2>Leçons à explorer</h2><div style="display:grid;gap:10px">${VIDEOS.map((x,ix)=>(!S.premium&&ix>=CONFIG.free.videos)?`<button class="card" data-act="paywall" data-f="Toutes les leçons vidéo" style="text-align:left;padding:14px 16px;width:100%"><div class="row" style="justify-content:space-between"><b>${x.t}${lockIco()}</b>${lvBadge(x.lv)}</div><span class="small mut">${x.d}</span></button>`:`<a class="card" style="display:block;text-decoration:none;color:inherit;padding:14px 16px" href="https://www.youtube.com/results?search_query=${encodeURIComponent(x.q)}" target="_blank" rel="noopener noreferrer"><div class="row" style="justify-content:space-between"><b>${x.t}</b>${lvBadge(x.lv)}</div><span class="small mut">${x.d}</span></a>`).join('')}</div></div></div>`;
};

/* ============ Actions ============ */
const A={
 nav:t=>{S.view=t.dataset.v;S.plan.openDay=null;render(true);},
 say:t=>speak(t.dataset.say,parseFloat(t.dataset.rate)||1),
 stop:()=>{stopSpeak();},
 starttest:t=>{if(isLocked('test',t.dataset.id))return paywall('Ce test');S.view='tests';S.test.open=t.dataset.id;render(true);},
 tback:()=>{S.test.open=null;render(true);},
 /* plan 90 jours */
 pmonth:t=>{
   const m=+t.dataset.m;
   if(!S.premium && m>1)return paywall('Mois '+m+' du Parcours 90 Jours');
   S.plan.month=m;render();
 },
 openday:t=>{
   const d=+t.dataset.d;
   if(!S.premium && d>CONFIG.free.daysMax)return paywall('Jour '+d+' du Parcours 90 Jours');
   S.view='plan';S.plan.month=Math.ceil(d/30);S.plan.openDay=d;render(true);
 },
 dayback:()=>{S.plan.openDay=null;render(true);},
 toggleday:t=>{
   const d=+t.dataset.d;
   if(!S.daysDone.has(d)){S.daysDone.add(d);addXP(20);toast('Bravo ! Jour '+d+' validé (+20 XP).');}
   else{S.daysDone.delete(d);saveProgress();}
   render();
 },
 /* vocab */
 vtheme:t=>{if(isLocked('vocab',t.dataset.k))return paywall('Le thème « '+VOCAB[t.dataset.k].label+' »');Object.assign(S.vocab,{theme:t.dataset.k,i:0,flip:false});render();},
 vmode:t=>{Object.assign(S.vocab,{mode:t.dataset.m,i:0,flip:false});render();},
 flip:()=>{S.vocab.flip=!S.vocab.flip;render();},
 know:()=>{const v=S.vocab;const k=v.theme+':'+v.i;if(!S.known.has(k)){S.known.add(k);addXP(2);}A._next();},
 review:()=>A._next(),
 _next:()=>{const v=S.vocab;v.i=(v.i+1)%VOCAB[v.theme].words.length;v.flip=false;render();},
 /* speaking */
 spidx:t=>{
   const ix=+t.dataset.i;
   if(!S.premium && ix>=CONFIG.free.speakN)return paywall('Tous les exercices de Speaking');
   Object.assign(S.speak,{i:ix,transcript:'',score:null,listening:false});render();
 },
 sprec:()=>{
   const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
   if(!SR)return toast("Reconnaissance vocale non disponible.");
   if(S.speak.listening)return;
   const rec=new SR();rec.lang='en-US';rec.interimResults=false;rec.maxAlternatives=1;
   S.speak.listening=true;render();
   rec.onresult=e=>{
     const said=e.results[0][0].transcript;
     const target=SPEAKING_PROMPTS[S.speak.i].en.toLowerCase().replace(/[^a-z0-9\s]/g,'').split(/\s+/);
     const got=said.toLowerCase().replace(/[^a-z0-9\s]/g,'').split(/\s+/);
     const matches=target.filter(w=>got.includes(w)).length;
     const sc=Math.min(100,Math.round(matches/target.length*100));
     S.speak.transcript=said;S.speak.score=sc;S.speak.listening=false;
     if(sc>=70)addXP(10);
     render();
   };
   rec.onerror=()=>{S.speak.listening=false;toast("Micro non détecté ou autorisation refusée.");render();};
   rec.onend=()=>{if(S.speak.listening){S.speak.listening=false;render();}};
   rec.start();
 },
 /* reading */
 ropen:t=>{if(isLocked('reading',t.dataset.id))return paywall('Ce texte de lecture');S.read.open=t.dataset.id;render(true);},
 rback:()=>{S.read.open=null;render(true);},
 rlisten:()=>{const r=READINGS.find(x=>x.id===S.read.open);playLines(r.text.split(/(?<=[.!?])\s+/).map(t=>({v:0,t})),0.95);},
 gloss:t=>{const r=READINGS.find(x=>x.id===S.read.open);$('#gloss').innerHTML=`<b>${esc(t.dataset.w)}</b> — ${esc(r.gloss[t.dataset.w])}`;speak(t.dataset.w,0.9);},
 /* listening */
 ltab:t=>{S.listen.tab=t.dataset.t;S.listen.open=null;render();},
 lopen:t=>{if(isLocked('listen',t.dataset.id))return paywall('Cet exercice d'écoute');S.listen.open=t.dataset.id;render(true);},
 lback:()=>{S.listen.open=null;render(true);},
 lplay:()=>{const x=LISTENS.find(a=>a.id===S.listen.open);playLines(x.lines,parseFloat($('#lrate').value));},
 ltrans:()=>{const e=$('#trans');e.style.display=e.style.display==='none'?'block':'none';},
 dcheck:()=>{
   const target=DICTATION[S.listen.dict],typed=$('#dtext').value;
   const norm=s=>s.toLowerCase().replace(/[^a-z0-9'\s]/g,'').split(/\s+/).filter(Boolean);
   const T=norm(target),U=norm(typed);
   const m=Array.from({length:T.length+1},()=>Array(U.length+1).fill(0));
   for(let i=T.length-1;i>=0;i--)for(let j=U.length-1;j>=0;j--)m[i][j]=T[i]===U[j]?m[i+1][j+1]+1:Math.max(m[i+1][j],m[i][j+1]);
   const okT=new Set(),okU=new Set();let i=0,j=0;
   while(i<T.length&&j<U.length){if(T[i]===U[j]){okT.add(i);okU.add(j);i++;j++;}else if(m[i+1][j]>=m[i][j+1])i++;else j++;}
   const sc=Math.round(okT.size/T.length*100);
   addXP(Math.round(sc/10));
   $('#dres').innerHTML=`<div class="fb ${sc===100?'ok':'no'}"><b>${sc===100?'Parfait !':sc+' % de mots corrects'}</b>
    <p style="margin:8px 0 4px">Phrase attendue :</p><p style="font-family:var(--serif);font-size:19px;margin:0">${T.map((w,k)=>`<span style="color:${okT.has(k)?'var(--ok)':'var(--bad)'};font-weight:${okT.has(k)?400:700}">${esc(w)}</span>`).join(' ')}</p>
    ${U.some((_,k)=>!okU.has(k))?`<p class="small" style="margin:8px 0 0">Mots en trop ou incorrects : ${U.filter((_,k)=>!okU.has(k)).map(esc).join(', ')}</p>`:''}</div>`;
 },
 dnext:()=>{if(!S.premium&&S.listen.dict+1>=CONFIG.free.dictN)return paywall('Les dictées suivantes');S.listen.dict++;render();},
 dreset:()=>{S.listen.dict=0;render();},
 /* writing */
 wtask:t=>{if(isLocked('write',t.dataset.id))return paywall('Ce sujet d'écriture');S.write.task=t.dataset.id;render();},
 wphrase:t=>{const ta=$('#wtext');ta.value+=(ta.value&&!/\s$/.test(ta.value)?' ':'')+t.dataset.p+' ';ta.focus();ta.dispatchEvent(new Event('input'));},
 wmodel:()=>{const W=S.write;W.model[W.task]=!W.model[W.task];render();},
 wanalyze:()=>{
   const W=S.write,t=WRITINGS.find(x=>x.id===W.task),txt=$('#wtext').value;W.texts[t.id]=txt;
   if(txt.trim().split(/\s+/).length<8){toast("Écrivez au moins quelques phrases avant l'analyse.");return;}
   W.reports[t.id]=analyzeWriting(t,txt);$('#wreport').innerHTML=W.reports[t.id];addXP(10);
   if(window.innerWidth<860)$('#wreport').scrollIntoView({behavior:'smooth'});
 },
 /* visual */
 vtab:t=>{if(isLocked('vis',t.dataset.t))return paywall('Ce support visuel');S.vis.tab=t.dataset.t;render();},
 vcat:t=>{if(isLocked('visCat',t.dataset.k))return paywall('Cette catégorie du dictionnaire visuel');S.vis.cat=t.dataset.k;render();},
 /* videos */
 vload:()=>{
   const m=$('#vurl').value.match(/(?:v=|youtu\.be\/|embed\/|shorts\/)([A-Za-z0-9_-]{11})/);
   if(m){S.vid.id=m[1];S.vid.msg='';}else{S.vid.msg="Lien non reconnu. Collez une adresse YouTube complète.";}
   render();
 },
 /* premium & Mobile Money */
 paywall:t=>paywall(t.dataset.f||''),
 pwclose:()=>closePaywall(),
 copynum:()=>{
   if(navigator.clipboard)navigator.clipboard.writeText('0757333736').then(()=>toast('Numéro 07 57 33 37 36 copié !'));
   else toast('Numéro : 07 57 33 37 36');
 },
 pwcode:()=>{
   const v=normCode($('#pwcode').value);
   if(v.length<6){$('#pwmsg').textContent="Saisissez votre code d'accès.";return;}
   // Vérification par empreinte ou codes maîtres
   const masterCodes=['CLW2026VIP1','CLWWAVE10000','CLWOMCI2026','CLWGOLD9001','CLWPRO12026','CLWFAST3373','CLWABID2026','CLW90JSVIP8'];
   if(CONFIG.codeHashes.includes(String(cyrb53(v))) || masterCodes.includes(v)){
     S.premium=true;store.set(STORE_PREM,'1');closePaywall();toast('🎉 Félicitations ! Accès Premium activé.');render();
   }else{$('#pwmsg').textContent="Code invalide. Vérifiez votre code ou contactez le +225 07 57 33 37 36.";}
 },
 premoff:()=>{S.premium=false;store.set(STORE_PREM,'0');toast('Premium désactivé sur cet appareil.');render(true);}
};

document.addEventListener('click',e=>{
  const t=e.target.closest('[data-act]');
  if(t&&A[t.dataset.act]){A[t.dataset.act](t,e);}
});
document.addEventListener('keydown',e=>{
  if((e.key==='Enter'||e.key===' ')&&e.target.matches('.fc,.gl')){e.preventDefault();e.target.click();}
  if(e.key==='Enter'&&e.target.id==='dtext'){A.dcheck();}
  if(e.key==='Enter'&&e.target.id==='vurl'){A.vload();}
  if(e.key==='Enter'&&e.target.id==='pwcode'){A.pwcode();}
  if(e.key==='Escape'){closePaywall();}
});
document.addEventListener('input',e=>{
  if(e.target.id==='wtext'){
    const t=WRITINGS.find(x=>x.id===S.write.task);S.write.texts[t.id]=e.target.value;
    const n=(e.target.value.trim().match(/[\w'’-]+/g)||[]).length;
    $('#wcount').textContent=`${n} / ${t.min} mots minimum`;
  }
});
render(false);
</script>
<script>
if('serviceWorker' in navigator && location.protocol.startsWith('http')){
  window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
}
</script>
